  platform: "[待补充]"
  resources:
    flash: "[待补充]"
    ram: "[待补充]"
  peripherals: []

architecture:
  os: "[待补充]"
  modules: []
  tasks: []

constraints:
  realtime: []
  safety: []

experts:
  - key: "domain_expert"
    domain: "[待确认]"
    description: "领域专家"
    focus: "[待确认]"
    ignore: "[待确认]"
    knowledge: []
    dimensions: []

attack_scenarios: []

topics:
  - id: "main_module"
    module: "[待补充]"
    summary: "[待补充]"
    attack_angles:
      - "[待补充]"
    desc: "[待补充]"
