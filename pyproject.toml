[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "committee"
version = "0.1.0"
description = "Multi-model design review committee"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
committee = "engine.cli:main_cli"

[tool.setuptools.packages.find]
include = ["engine*"]
